<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>UtilBox</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      }
      fieldset {
        border: 1px solid #8884;
        border-radius: 12px;
        padding: 8px 12px;
      }
      fieldset:disabled {
        opacity: 0.6;
      }
      label {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
      }
      #error {
        color: #d33;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UtilBox</h1>
      <section>
        <h2>Optimization</h2>
        <p id="status">Loading…</p>
        <fieldset id="modes" disabled></fieldset>
        <p id="error" role="alert"></p>
      </section>
    </main>
    <script>
      const SCRIPT =
        "/data/adb/modules/utilbox/features/perf_mode/perf_mode.sh";
      const modesEl = document.getElementById("modes");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const labels = new Map();
      let seq = 0;

      // Same contract as the kernelsu npm package's exec().
      function exec(cmd) {
        return new Promise((resolve, reject) => {
          if (typeof ksu === "undefined") {
            reject(
              new Error("Open this page from the KernelSU or APatch manager."),
            );
            return;
          }
          const cb = `utilbox_exec_${Date.now()}_${seq++}`;
          window[cb] = (errno, stdout, stderr) => {
            delete window[cb];
            resolve({ errno, stdout, stderr });
          };
          ksu.exec(cmd, "{}", cb);
        });
      }

      function renderModes(listOutput, current) {
        labels.clear();
        modesEl.replaceChildren();
        for (const line of listOutput.trim().split("\n")) {
          const [id, text] = line.split("|");
          if (!/^[a-z]+$/.test(id) || !text) continue;
          labels.set(id, text);
          const input = document.createElement("input");
          input.type = "radio";
          input.name = "mode";
          input.value = id;
          input.checked = id === current;
          const label = document.createElement("label");
          label.append(input, text);
          modesEl.append(label);
        }
      }

      async function load() {
        const [list, status] = await Promise.all([
          exec(`sh ${SCRIPT} list`),
          exec(`sh ${SCRIPT} status`),
        ]);
        const [current, live] = status.stdout.trim().split(" ");
        renderModes(list.stdout, current);
        let text = `Current: ${labels.get(current) ?? current}`;
        if (live === "drift")
          text += " (live values were changed by something else)";
        statusEl.textContent = text;
        modesEl.disabled = false;
      }

      modesEl.addEventListener("change", async (event) => {
        const id = event.target.value;
        if (!labels.has(id)) return;
        modesEl.disabled = true;
        errorEl.textContent = "";
        try {
          const result = await exec(`sh ${SCRIPT} apply ${id}`);
          if (result.errno !== 0) errorEl.textContent = result.stderr.trim();
          await load();
        } catch (err) {
          errorEl.textContent = err.message;
        }
      });

      load().catch((err) => {
        statusEl.textContent = "";
        errorEl.textContent = err.message;
      });
    </script>
  </body>
</html>
