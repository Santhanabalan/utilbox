<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>UtilBox</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app-layout">
      <header class="app-top-bar">
        <div class="app-top-bar-inner">
          <h1 class="app-title">UtilBox</h1>
        </div>
      </header>

      <main>
        <div id="pages">
          <section id="summary-page"></section>
          <section id="optimization-page" hidden></section>
          <section id="battery-page" hidden></section>
        </div>
      </main>

      <nav class="nav-bar" aria-label="Main navigation">
        <button
          class="nav-tab nav-tab--active"
          data-page="summary-page"
          aria-current="page"
        >
          <md-icon class="nav-icon" aria-hidden="true">dashboard</md-icon>
          <span class="nav-label">Summary</span>
        </button>
        <button class="nav-tab" data-page="optimization-page">
          <md-icon class="nav-icon" aria-hidden="true">speed</md-icon>
          <span class="nav-label">Optimization</span>
        </button>
        <button class="nav-tab" data-page="battery-page">
          <md-icon class="nav-icon" aria-hidden="true"
            >battery_charging_full</md-icon
          >
          <span class="nav-label">Battery</span>
        </button>
      </nav>
    </div>

    <script type="module" src="js/app.ts"></script>
  </body>
</html>
